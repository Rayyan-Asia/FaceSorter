spring:
  application:
    name: facesorter-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:facesorter}
    username: ${DB_USERNAME:facesorter}
    password: ${DB_PASSWORD:facesorter}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
        provider:
          google:
            issuer-uri: https://accounts.google.com
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com

server:
  port: ${SERVER_PORT:8080}

facesorter:
  similarity-threshold: ${SIMILARITY_THRESHOLD:0.45}
  embedding-dimension: ${EMBEDDING_DIMENSION:128}
